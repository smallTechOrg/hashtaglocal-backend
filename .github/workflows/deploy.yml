name: Deploy to Cloud Run

# staging branch -> hashtaglocal-backend-staging, main -> hashtaglocal-backend.
# One-time GCP setup: scripts/gcp_setup.sh. Details: infra/cloud-run.md.

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:   # re-run a deploy of the selected branch by hand

# One deploy per branch at a time, in push order. Never cancel one half way.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  AR_REPOSITORY: hashtaglocal-backend
  IMAGE_NAME: hashtaglocal-backend

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hashtaglocaltest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/hashtaglocaltest
      TEST_DB_USERNAME: postgres
      TEST_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # GcsConfig reads a service-account key file at startup. The tests mock
      # the storage calls, so a throwaway key is enough.
      - name: Create throwaway GCS key for the tests
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/test.pem"
          jq -n --rawfile key "$RUNNER_TEMP/test.pem" '{
            type: "service_account", project_id: "test",
            private_key_id: "test", private_key: $key,
            client_email: "test@test.iam.gserviceaccount.com", client_id: "1",
            token_uri: "https://oauth2.googleapis.com/token"
          }' > "$RUNNER_TEMP/gcs-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcs-key.json" >> "$GITHUB_ENV"

      - run: ./gradlew --no-daemon test

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    env:
      IS_PROD: ${{ github.ref_name == 'main' }}
      APP_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      SERVICE: ${{ github.ref_name == 'main' && 'hashtaglocal-backend' || 'hashtaglocal-backend-staging' }}
      # The app runs @Scheduled jobs in-process (event scrape, bulletin,
      # session cleanup, feed moderation sweeper), so exactly one instance must
      # always be running with CPU: min 1, max 1, no CPU throttling. Raise
      # CLOUD_RUN_MAX_INSTANCES only if every job may run once per instance.
      MIN_INSTANCES: ${{ vars.CLOUD_RUN_MIN_INSTANCES || '1' }}
      MAX_INSTANCES: ${{ vars.CLOUD_RUN_MAX_INSTANCES || '1' }}
      CONCURRENCY: ${{ vars.CLOUD_RUN_CONCURRENCY || '40' }}
      # The database (Cloud SQL) has a private IP, so the service reaches it
      # through Direct VPC egress. Set VPC_NETWORK to "none" to turn this off.
      VPC_NETWORK: ${{ vars.VPC_NETWORK || 'default' }}
      VPC_SUBNET: ${{ vars.VPC_SUBNET || vars.VPC_NETWORK || 'default' }}
      # Per-environment settings: *_PRODUCTION for main, *_STAGING for staging.
      APP_SELF_BASE_URL: ${{ github.ref_name == 'main' && vars.APP_SELF_BASE_URL_PRODUCTION || vars.APP_SELF_BASE_URL_STAGING }}
      APP_FORWARDED_PREFIX: ${{ github.ref_name == 'main' && (vars.APP_FORWARDED_PREFIX_PRODUCTION || '/local') || (vars.APP_FORWARDED_PREFIX_STAGING || '/localstaging') }}
      EVENTS_SCRAPE_URL: ${{ github.ref_name == 'main' && vars.EVENTS_SCRAPE_URL_PRODUCTION || vars.EVENTS_SCRAPE_URL_STAGING }}
      PORTALISSUE_SCRAPE_URL: ${{ github.ref_name == 'main' && vars.PORTALISSUE_SCRAPE_URL_PRODUCTION || vars.PORTALISSUE_SCRAPE_URL_STAGING }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve names
        run: |
          echo "IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "RUNTIME_SA=hashtaglocal-backend-run@${PROJECT_ID}.iam.gserviceaccount.com" >> "$GITHUB_ENV"
          # Secrets that differ between the two databases carry the environment
          # as a suffix, e.g. HASHTAGLOCAL_DB_PASSWORD_STAGING.
          echo "SECRET_SUFFIX=$([ "$IS_PROD" = "true" ] && echo PRODUCTION || echo STAGING)" >> "$GITHUB_ENV"

      - name: Build and push image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Write service environment
        # Plain settings. Secrets come from Secret Manager (--set-secrets below).
        run: |
          env_file="$RUNNER_TEMP/env.yaml"
          : > "$env_file"
          add() { printf '%s: "%s"\n' "$1" "$2" >> "$env_file"; }
          # Only written when set, so an unset variable keeps the app default.
          add_if() { [ -z "$2" ] || add "$1" "$2"; }

          add GOOGLE_APPLICATION_CREDENTIALS "/secrets/gcs/gcs-key.json"
          add FIREBASE_CREDENTIALS_PATH "/secrets/firebase/firebase-key.json"
          # Cloud Logging collects stdout; a log file would only fill memory.
          add LOGGING_FILE_NAME ""
          add LOGGING_LEVEL_ORG_SMALLTECH_HASHTAGLOCAL_BACKEND "INFO"
          add SPRING_JPA_SHOW_SQL "false"
          add APP_FORWARDED_PREFIX "$APP_FORWARDED_PREFIX"
          add_if APP_SELF_BASE_URL "$APP_SELF_BASE_URL"
          add_if EVENTS_SCRAPE_URL "$EVENTS_SCRAPE_URL"
          add_if PORTALISSUE_SCRAPE_URL "$PORTALISSUE_SCRAPE_URL"
          add_if PORTALISSUE_REPORT_SCRAPE_URL "$PORTALISSUE_SCRAPE_URL"
          add_if GOOGLE_STORAGE_BUCKET_NAME "${{ vars.GOOGLE_STORAGE_BUCKET_NAME }}"
          add_if GCS_PROJECT_ID "$PROJECT_ID"
          add_if ACCOUNT_DELETION_ADMIN_EMAIL "${{ vars.ACCOUNT_DELETION_ADMIN_EMAIL }}"
          add_if ACCOUNT_DELETION_FROM_EMAIL "${{ vars.ACCOUNT_DELETION_FROM_EMAIL }}"
          add_if SPRING_MAIL_HOST "${{ vars.SPRING_MAIL_HOST }}"
          add_if SPRING_MAIL_PORT "${{ vars.SPRING_MAIL_PORT }}"
          add_if SPRING_MAIL_USERNAME "${{ vars.SPRING_MAIL_USERNAME }}"
          add_if SPRING_MAIL_SMTP_FROM "${{ vars.SPRING_MAIL_SMTP_FROM }}"
          add_if SPRING_MAIL_SMTP_LOCALHOST "${{ vars.SPRING_MAIL_SMTP_LOCALHOST }}"
          cat "$env_file"

      - name: Deploy to Cloud Run (no traffic yet)
        run: |
          # Secret Manager secret -> env var, or -> file for the two key files.
          # DB secrets differ per environment (suffix); the rest are shared.
          secrets="SPRING_DATASOURCE_URL=HASHTAGLOCAL_DB_URL_${SECRET_SUFFIX}:latest"
          secrets+=",SPRING_DATASOURCE_USERNAME=HASHTAGLOCAL_DB_USERNAME_${SECRET_SUFFIX}:latest"
          secrets+=",SPRING_DATASOURCE_PASSWORD=HASHTAGLOCAL_DB_PASSWORD_${SECRET_SUFFIX}:latest"
          secrets+=",GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest"
          secrets+=",GROQ_API_KEY=GROQ_API_KEY:latest"
          secrets+=",GEMINI_API_KEY=GEMINI_API_KEY:latest"
          secrets+=",SPRING_MAIL_PASSWORD=SPRING_MAIL_PASSWORD:latest"
          secrets+=",PORTALISSUE_AUTH_USERNAME=PORTALISSUE_AUTH_USERNAME:latest"
          secrets+=",PORTALISSUE_AUTH_PASSWORD=PORTALISSUE_AUTH_PASSWORD:latest"
          secrets+=",/secrets/gcs/gcs-key.json=HASHTAGLOCAL_GCS_KEY:latest"
          secrets+=",/secrets/firebase/firebase-key.json=HASHTAGLOCAL_FIREBASE_KEY:latest"

          args=(
            --image "$IMAGE"
            --region "$REGION"
            --service-account "$RUNTIME_SA"
            --allow-unauthenticated
            --port 8080
            --cpu 1
            --memory 1Gi
            --concurrency "$CONCURRENCY"
            --timeout 300
            --cpu-boost
            --no-cpu-throttling
            --min-instances "$MIN_INSTANCES"
            --max-instances "$MAX_INSTANCES"
            --env-vars-file "$RUNNER_TEMP/env.yaml"
            --set-secrets "$secrets"
            --labels "app=hashtaglocal-backend,env=${APP_ENV},commit=${GITHUB_SHA::12}"
            --quiet
          )
          # Reach the database's private IP through Direct VPC egress. Only
          # private ranges go through the VPC; Groq, Gemini and GCS go out directly.
          if [ "$VPC_NETWORK" != "none" ]; then
            args+=(--network "$VPC_NETWORK" --subnet "$VPC_SUBNET" --vpc-egress private-ranges-only)
          fi

          if gcloud run services describe "$SERVICE" --region "$REGION" >/dev/null 2>&1; then
            # Existing service: start the new revision without traffic and
            # give it the "candidate" URL, so it is checked before users see it.
            gcloud run deploy "$SERVICE" "${args[@]}" --no-traffic --tag candidate
            echo "FIRST_DEPLOY=false" >> "$GITHUB_ENV"
          else
            # First deploy: nothing to protect yet, --no-traffic is not allowed.
            gcloud run deploy "$SERVICE" "${args[@]}"
            echo "FIRST_DEPLOY=true" >> "$GITHUB_ENV"
          fi

      - name: Smoke test the new revision
        run: |
          if [ "$FIRST_DEPLOY" = "true" ]; then
            URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          else
            URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json \
              | jq -r '.status.traffic[] | select(.tag == "candidate") | .url')
          fi
          echo "Checking $URL/actuator/health"
          # Spring Boot takes a while to start: allow about 3 minutes.
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 15 "$URL/actuator/health" || true)
            echo "attempt $i: HTTP $CODE $(head -c 300 /tmp/health.json 2>/dev/null)"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 6
          done
          echo "::error::New revision did not report a healthy database. Traffic was not moved."
          exit 1

      - name: Send traffic to the new revision
        if: env.FIRST_DEPLOY == 'false'
        run: gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-latest --quiet

      - name: Summary
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          {
            echo "### Deployed ${SERVICE}"
            echo "- URL: ${URL}"
            echo "- Image: \`${IMAGE}\`"
            echo "- Environment: ${APP_ENV}"
          } >> "$GITHUB_STEP_SUMMARY"
