spring:
  datasource:
    # Values come from .env (loaded by the Gradle test task) or real environment variables.
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/hashtaglocaltest}
    driver-class-name: org.postgresql.Driver
    username: ${TEST_DB_USERNAME:postgres}
    password: ${TEST_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

events:
  scrape:
    cron: "-"

portalissue:
  enabled: false

# Feed: keep the auto issue-ref and AI moderation out of unrelated issue/event tests.
# Feed-specific tests enable these explicitly.
feed:
  auto-issue-ref:
    enabled: false
  moderation:
    enabled: false
    sweeper-delay-ms: 3600000
