spring:
  application:
    name: hashtaglocal-backend
  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    url: jdbc:postgresql://localhost:5432/hashtaglocal
    username: username
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Versioned migrations in db/migration, run before Hibernate. Off by default so local dev and
  # tests keep using ddl-auto; the Cloud Run deploy turns it on (FLYWAY_ENABLED=true).
  # An existing database with no Flyway history is baselined at FLYWAY_BASELINE_VERSION: it is
  # treated as already having every migration up to and including that version.
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}
  # Added: SMTP settings for sending admin notification emails on account deletion requests
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
          from: ${SPRING_MAIL_SMTP_FROM:}
          localhost: ${SPRING_MAIL_SMTP_LOCALHOST:}

logging:
  level:
    root: INFO
    org.smalltech.hashtaglocal_backend: DEBUG
  file:
    name: logs/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 10

# Background jobs. In-process @Scheduled jobs run unless SCHEDULER_ENABLED=false (Cloud Run), where
# Cloud Scheduler calls POST /jobs/{name} instead. A call must carry a Google OIDC token with this
# audience from one of the allowed service accounts (comma-separated); empty refuses every call.
jobs:
  in-process-scheduler: ${SCHEDULER_ENABLED:true}
  oidc:
    audience: ${JOBS_OIDC_AUDIENCE:}
    allowed-invokers: ${JOBS_ALLOWED_INVOKERS:}

# Application-specific custom configuration
app:
  geo:
    verify-radius-meters: 100
  # This backend's own public base URL, sent as X-Backend-Url to the shared scraper
  # service so it can dedupe FETCH_EVENTS results against the correct database
  # (staging and production both call the same scraper deployment).
  self-base-url: ${APP_SELF_BASE_URL:}

# Added: account deletion workflow config — admin-email receives deletion notifications;
# from-email is used as the SMTP sender address
account:
  deletion:
    admin-email: ${ACCOUNT_DELETION_ADMIN_EMAIL:}
    from-email: ${ACCOUNT_DELETION_FROM_EMAIL:}

# Google Maps API configuration
google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:}
  storage:
    bucket-name: ${GOOGLE_STORAGE_BUCKET_NAME:}

apple:
  bundle-id: ${APPLE_BUNDLE_ID:com.smalltech.hashtaglocal}

management:
  health:
    diskspace:
      enabled: false
    db:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /v1/swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    display-request-duration: true
  paths-to-match:
    - /**
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# Master switch for every push notification (chat, issue, bulletin, ops broadcast). Off by default:
# nothing is sent to FCM unless NOTIFICATIONS_ENABLED=true. The per-feature switches
# (feed.notification.enabled, bulletin.notification.enabled) only apply when this is on.
notifications:
  enabled: ${NOTIFICATIONS_ENABLED:false}

firebase:
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:firebase-key.json}

# Google Cloud Storage Configuration
gcs:
  credentials:
    path: gcs-key.json
  project:
    id: ${GCS_PROJECT_ID:}

geonames:
  username: ${GEONAMES_USERNAME:mmk1}

auth:
  access-token:
    expiry-seconds: ${AUTH_ACCESS_TOKEN_EXPIRY_SECONDS:10}
  refresh-token:
    expiry-seconds: ${AUTH_REFRESH_TOKEN_EXPIRY_SECONDS:30}
  session:
    cleanup-cron: ${AUTH_SESSION_CLEANUP_CRON:0 0 3 * * *}

events:
  scrape:
    # URL of the external scrape service that provides raw event data
    url: ${EVENTS_SCRAPE_URL:https://staging.api.smalltech.in/webscraperstaging/api/v1/scrape}
    # Cron expression for the ingestion job. Use '-' to disable. Override via EVENTS_SCRAPE_CRON env var.
    cron: ${EVENTS_SCRAPE_CRON:0 */5 * * * *}

# Per-hashtag feed / broadcast channel (see FEED_DESIGN.md)
feed:
  moderation:
    # When false (e.g. local dev without a key), user posts are FLAGGED for human review
    # instead of being auto-published. Never auto-publishes without AI.
    # The AI is the provider saved in the Ops Dashboard (see ai.config below).
    enabled: ${FEED_MODERATION_ENABLED:true}
    # Retry sweeper interval for posts stuck in PENDING_AI
    sweeper-delay-ms: ${FEED_MODERATION_SWEEPER_DELAY_MS:60000}
  scrape:
    timeout-ms: ${FEED_SCRAPE_TIMEOUT_MS:8000}
    max-body-bytes: ${FEED_SCRAPE_MAX_BODY_BYTES:2097152}
    # Cap on the Open Graph image we re-host to GCS (5 MB default).
    max-image-bytes: ${FEED_SCRAPE_MAX_IMAGE_BYTES:5242880}
  auto-issue-ref:
    # Auto-post an ISSUE_REF to the feed when a new issue is created (FEED_DESIGN.md §1.2)
    enabled: ${FEED_AUTO_ISSUE_REF_ENABLED:true}
  notification:
    # Send a push to the locality for every new chat post (bulletins use their own switch).
    # Run scripts/migrate-chat-post-notification.sql before deploying, or no chat push is sent.
    enabled: ${FEED_NOTIFICATION_ENABLED:true}
    # Send the push inside the publishing request (Cloud Run: no CPU after the response).
    inline: ${FEED_NOTIFICATION_INLINE:false}

# City bulletin: daily weather (cron, saved-user localities only) + manual quizzes + AI texts
bulletin:
  enabled: ${BULLETIN_ENABLED:true}
  notification:
    # Push a "Daily Bulletin" notification when a locality's bulletin post is published.
    # On by default. Run scripts/migrate-bulletin-notification.sql BEFORE deploying, otherwise the
    # claim insert fails and no push is sent (logged as an error). Set to false to turn it off.
    enabled: ${BULLETIN_NOTIFICATION_ENABLED:true}
  weather:
    # Daily at 8:00 AM. Use '-' to disable.
    cron: ${BULLETIN_WEATHER_CRON:0 0 8 * * *}
    # Active WeatherProvider implementation; open-meteo is free and keyless.
    provider: ${BULLETIN_WEATHER_PROVIDER:open-meteo}
    open-meteo:
      url: ${BULLETIN_OPEN_METEO_URL:https://api.open-meteo.com/v1/forecast}
  ai:
    # Spaces the weather summary / quiz explanation calls to the AI provider, so the daily run
    # over every locality stays under the provider's per-minute limit.
    requests-per-minute: ${BULLETIN_AI_REQUESTS_PER_MINUTE:12}

# All AI (quizzes, bulletin texts, feed moderation) uses the provider an admin saves in the Ops
# Dashboard (AI Provider page; ai.config below).
#
# DEPRECATED .env fallback, used only while nothing is saved in the Ops Dashboard. The groq and
# gemini levels will be removed; set the provider in the Ops Dashboard instead.
# Tried top to bottom: each model on every key, then the next model, then the next provider.
# Models (best first) and keys are comma-separated. A level with no models or no keys is skipped.
# Each key must come from a separate account/org (Gemini: separate Google Cloud project),
# otherwise the keys share one quota.
ai:
  quiz:
    chain:
      - provider: anthropic
        models: ${QUIZ_ANTHROPIC_MODELS:${ANTHROPIC_MODEL:claude-sonnet-5-5},claude-haiku-5-5}
        keys: ${QUIZ_ANTHROPIC_KEYS:${ANTHROPIC_API_KEY:}}
      - provider: groq
        models: ${QUIZ_GROQ_MODELS:}
        keys: ${QUIZ_GROQ_KEYS:}
      - provider: gemini
        models: ${QUIZ_GEMINI_MODELS:gemini-4-neon,gemini-3.1-flash-lite}
        keys: ${QUIZ_GEMINI_KEYS:}
  # The provider an admin saves in the Ops Dashboard (AI Provider page) replaces the chain above
  # for every AI feature, with no restart. With nothing saved, the chain above is used.
  config:
    # Base64 of 32 random bytes (openssl rand -base64 32). Encrypts the saved API key (AES-GCM).
    # Secret: set it in the environment / secret manager only. Without it, keys cannot be saved.
    encryption-key: ${AI_CONFIG_ENCRYPTION_KEY:}
    # SSRF guard: endpoints on private/loopback/link-local addresses are refused unless true.
    allow-private-endpoints: ${AI_CONFIG_ALLOW_PRIVATE_ENDPOINTS:false}
    # Per-instance cache of the saved config; a save clears it on the instance that handled it.
    cache-ttl: ${AI_CONFIG_CACHE_TTL:30s}

portalissue:
  enabled: ${PORTALISSUE_ENABLED:true}
  cron: ${PORTALISSUE_CRON:0 0 1 * * *}
  scrape-url: ${PORTALISSUE_SCRAPE_URL:https://staging.api.smalltech.in/webscraperstaging/api/v1/scrape}
  report:
    scrape-url: ${PORTALISSUE_REPORT_SCRAPE_URL:https://staging.api.smalltech.in/webscraperstaging/api/v1/scrape}
    connect-timeout-seconds: ${PORTALISSUE_REPORT_CONNECT_TIMEOUT_SECONDS:15}
    read-timeout-seconds: ${PORTALISSUE_REPORT_READ_TIMEOUT_SECONDS:305}
  auth:
    username: ${PORTALISSUE_AUTH_USERNAME:placeholder_username}
    password: ${PORTALISSUE_AUTH_PASSWORD:placeholder_password}
